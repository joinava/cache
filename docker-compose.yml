services:
  redis:
    image: redis:7-alpine
    # Non-default host port to avoid clashing with locally-running Redis
    # instances. Override via `REDIS_PORT` if needed.
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 1s
      timeout: 1s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DATABASE_USER:-cache}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-cache}
      POSTGRES_DB: ${DATABASE_NAME:-cache}
    # Non-default host port to avoid clashing with locally-running Postgres
    # instances. Override via `DATABASE_PORT` if needed.
    ports:
      - "${DATABASE_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-cache}"]
      interval: 1s
      timeout: 1s
      retries: 10
